<label class="check" for="field-3"><input type="checkbox" id="field-3">A favourite treat or sealed snacks from your area.</label>
<label class="check" for="field-4"><input type="checkbox" id="field-4">A keepsake, such as a framed photo or personalised keyring.</label>
<label class="check" for="field-5"><input type="checkbox" id="field-5">One short note about why you chose the gifts.</label>
<h2>PACK THE BOX</h2>
<label class="check" for="field-7"><input type="checkbox" id="field-7">Check preferences, clothing sizes, ingredients and allergies.</label>
<label class="check" for="field-8"><input type="checkbox" id="field-8">Keep scented fabric separate from food.</label>
<label class="check" for="field-9"><input type="checkbox" id="field-9">Leave snacks sealed and check their expiry dates.</label>
<label class="check" for="field-10"><input type="checkbox" id="field-10">Cushion fragile items and prevent movement inside the parcel.</label>
<label class="check" for="field-11"><input type="checkbox" id="field-11">Confirm the address and delivery arrangements.</label>
<label class="check" for="field-12"><input type="checkbox" id="field-12">Check carrier and destination rules for each item.</label>
<label class="check" for="field-13"><input type="checkbox" id="field-13">Complete any required customs paperwork accurately.</label>
<label class="check" for="field-14"><input type="checkbox" id="field-14">Keep the parcel tracking reference.</label>
