<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">What are you up for tonight?</title><desc id="desc">Five setups. Pick the one that fits your energy.</desc><rect width="1200" height="680" rx="28" fill="#fff9f6"/><g font-family="Arial, sans-serif" fill="#2c1a30"><text x="60" y="60" font-size="17" letter-spacing="3" fill="#a92b5c">DREAMDUO · PRACTICAL GUIDES</text><text x="60" y="120" font-size="40" font-weight="700">What are you up for tonight?</text><text x="60" y="158" font-size="22" fill="#645969">Five setups. Pick the one that fits your energy.</text><rect x="60" y="196" width="1080" height="72" rx="14" fill="#fbe3eb"/><text x="84" y="238" font-size="22" font-weight="700">DRAW</text><text x="245" y="225" font-size="23" font-weight="700">Paper + a pen</text><text x="245" y="252" font-size="21" >One minute. No looking at the page.</text><rect x="60" y="281" width="1080" height="72" rx="14" fill="#f6e8d6"/><text x="84" y="323" font-size="22" font-weight="700">COOK</text><text x="245" y="310" font-size="23" font-weight="700">An easy recipe</text><text x="245" y="337" font-size="21" >Same first step. Different kitchens.</text><rect x="60" y="366" width="1080" height="72" rx="14" fill="#e3eee8"/><text x="84" y="408" font-size="22" font-weight="700">ASK</text><text x="245" y="395" font-size="23" font-weight="700">One good question</text><text x="245" y="422" font-size="21" >Both answer. Then ask a follow-up.</text><rect x="60" y="451" width="1080" height="72" rx="14" fill="#eae5f2"/><text x="84" y="493" font-size="22" font-weight="700">WATCH</text><text x="245" y="480" font-size="23" font-weight="700">A title you can both access</text><text x="245" y="507" font-size="21" >Check access before date night.</text><rect x="60" y="536" width="1080" height="72" rx="14" fill="#f6e0d8"/><text x="84" y="578" font-size="22" font-weight="700">PLAN</text><text x="245" y="565" font-size="23" font-weight="700">One future adventure</text><text x="245" y="592" font-size="21" >Choose a first step, not a whole trip.</text></g></svg>