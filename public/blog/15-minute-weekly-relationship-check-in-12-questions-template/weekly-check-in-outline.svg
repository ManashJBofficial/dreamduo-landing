<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">A little time to hear each other.</title><desc id="desc">15 minutes · use the questions as a menu</desc><rect width="1200" height="680" rx="28" fill="#fff9f6"/><g font-family="Arial, sans-serif" fill="#2c1a30"><text x="60" y="60" font-size="17" letter-spacing="3" fill="#a92b5c">DREAMDUO · PRACTICAL GUIDES</text><text x="60" y="120" font-size="40" font-weight="700">A little time to hear each other.</text><text x="60" y="158" font-size="22" fill="#645969">15 minutes · use the questions as a menu</text><rect x="60" y="194" width="1080" height="72" rx="14" fill="#fbe3eb"/><text x="84" y="237" font-size="23" font-weight="700">2 MIN</text><text x="255" y="223" font-size="25" font-weight="700">Appreciation</text><text x="255" y="251" font-size="21" >Name one specific moment you valued.</text><rect x="60" y="280" width="1080" height="72" rx="14" fill="#f6e8d6"/><text x="84" y="323" font-size="23" font-weight="700">3 MIN</text><text x="255" y="309" font-size="25" font-weight="700">Feelings</text><text x="255" y="337" font-size="21" >Listen before trying to fix anything.</text><rect x="60" y="366" width="1080" height="72" rx="14" fill="#e3eee8"/><text x="84" y="409" font-size="23" font-weight="700">3 MIN</text><text x="255" y="395" font-size="25" font-weight="700">Practical needs</text><text x="255" y="423" font-size="21" >Ask for help or space for the week ahead.</text><rect x="60" y="452" width="1080" height="72" rx="14" fill="#eae5f2"/><text x="84" y="495" font-size="23" font-weight="700">4 MIN</text><text x="255" y="481" font-size="25" font-weight="700">One challenge</text><text x="255" y="509" font-size="21" >Choose one issue, not the whole history.</text><rect x="60" y="538" width="1080" height="72" rx="14" fill="#f6e0d8"/><text x="84" y="581" font-size="23" font-weight="700">3 MIN</text><text x="255" y="567" font-size="25" font-weight="700">Next step</text><text x="255" y="595" font-size="21" >One action, one owner, one time to return.</text></g></svg>